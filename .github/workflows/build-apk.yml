name: 打包APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 设置Android环境变量
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
      - name: 准备www目录
        run: |
          mkdir -p www
          cp -r js css *.html *.json *.png *.ico *.webmanifest www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
      - run: npm install
      - run: npx cap init "rua小手机" "com.rua.phone" --web-dir=www
      - run: npx cap add android
      - run: npx cap sync
      - name: 设置沉浸全屏
        run: |
          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          EOF
          sed -i '/AppTheme\.NoActionBarLaunch/d' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name="\.MainActivity"|android:name=".MainActivity" android:theme="@style/AppTheme"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|import com.getcapacitor.BridgeActivity;|import com.getcapacitor.BridgeActivity;\nimport android.view.View;|' android/app/src/main/java/com/rua/phone/MainActivity.java
          sed -i '/super\.onCreate/i\
          hideSystemUI();' android/app/src/main/java/com/rua/phone/MainActivity.java
          cat >> android/app/src/main/java/com/rua/phone/MainActivity.java << 'JAVAEOF'

              private void hideSystemUI() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }
          }
          JAVAEOF
      - name: 添加文件权限
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: 允许HTTP明文
        run: sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
      - name: 编译APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rua-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk