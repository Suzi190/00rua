name: 打包APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # 需要 write 才能在最后一步把 APK 发布到 Release（仅用内置的 GITHUB_TOKEN）
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK="$HOME/Android/Sdk"; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          echo "SDK 目录：$SDK"
          ls "$SDK/platforms" || true

      - name: 安装依赖
        run: npm install

      - name: 准备 www 目录（网页资源打进 APK）
        run: |
          set -e
          rm -rf www
          mkdir -p "www/leaflet@1.9.4"
          cp -f index.html dressup.html manifest.json www/
          cp -f apple-touch-icon.png favicon.ico favicon-32x32.png icon-192.png icon-512.png www/
          cp -r css js assets www/
          cp -r node_modules/leaflet/dist "www/leaflet@1.9.4/dist"
          test -s www/js/app-01.js
          test -s www/js/app-07.js
          test -s www/js/rua-diag.js
          test -s www/css/style-01.css
          grep -q 'js/rua-diag.js' www/index.html
          # ⚠ 防回归自检：登录浮层必须留在 #phoneScreen 内部。
          # 真机（APK/窄屏/触摸设备）命中 @media (max-width:768px) 与 (hover:none) and (pointer:coarse)，
          # 会把 .phone-frame 变成 position:fixed + z-index:9998 !important；浮层一旦被挪到 document.body，
          # 自身 z-index:9000 就会被手机框永久盖住 —— 现象是「点微信完全没反应、不报错、无提示」。
          node -e "
            const fs = require('fs');
            const wa = fs.readFileSync('www/js/world-accounts.js', 'utf8');
            const i = wa.indexOf('function openAuth(');
            const j = wa.indexOf('WA.openAuth = openAuth');
            if (i < 0 || j < i) {
              console.log('::warning::world-accounts.js 里找不到 openAuth 的边界，请人工确认登录浮层没有被挪出手机框');
            } else {
              const body = wa.slice(i, j);
              if (/document\.body\.appendChild\(o\)/.test(body)) {
                console.error('::error::openAuth 又把登录浮层挪到 document.body 了：真机上会被 .phone-frame(z-index:9998) 盖住，表现成「点微信没反应」');
                process.exit(1);
              }
              console.log('登录浮层位置自检通过：浮层留在手机框内 ✓');
            }
            const css = fs.readFileSync('www/css/style-01.css', 'utf8');
            const m = css.match(/\.toast\s*\{[^}]*z-index:(\d+)/);
            if (!m) console.log('::warning::没解析到 .toast 的 z-index，请确认 toast 的层级');
            else if (Number(m[1]) < 9000) console.log('::warning::.toast 的 z-index=' + m[1] + ' 低于登录浮层(9000)，登录页上的提示可能被遮住');
            else console.log('.toast z-index=' + m[1] + ' 高于应用内浮层 ✓');
          "

          test -s www/assets/expressions/01_smile.png
          test -s www/dressup.html
          test -s "www/leaflet@1.9.4/dist/leaflet.js"
          node -e "
            const c = require('crypto'), f = require('fs');
            const html = f.readFileSync('www/index.html', 'utf8');
            for (const p of ['leaflet.js', 'leaflet.css']) {
              const h = c.createHash('sha256').update(f.readFileSync('www/leaflet@1.9.4/dist/' + p)).digest('base64');
              if (html.indexOf('sha256-' + h) === -1) {
                console.log('::warning::leaflet ' + p + ' 的 sha256 与 index.html 中的 integrity 不一致，地图可能加载失败');
              } else {
                console.log('leaflet ' + p + ' SRI 校验通过：sha256-' + h);
              }
            }
          "
          echo '--- www 内容 ---'
          ls www | head -30

      - name: 生成 Android 工程
        run: |
          set -e
          npx cap add android
          npx cap sync android
          test -f android/app/src/main/java/com/rua/phone/MainActivity.java

      - name: 注入原生代码（沉浸式全屏 + 文件导出）
        run: |
          set -e
          APP=android/app/src/main/java/com/rua/phone
          cp -f android-overlay/java/com/rua/phone/MainActivity.java "$APP/MainActivity.java"
          cp -f android-overlay/java/com/rua/phone/AndroidFileSaver.java "$APP/AndroidFileSaver.java"
          cp -f android-overlay/res/values/styles.xml android/app/src/main/res/values/styles.xml
          grep -q 'class MainActivity extends BridgeActivity' "$APP/MainActivity.java"
          grep -q 'AndroidFileSaver' "$APP/MainActivity.java"
          grep -q 'hideSystemUI' "$APP/MainActivity.java"
          grep -q 'applyEdgeToEdge' "$APP/MainActivity.java"
          grep -q 'setDecorFitsSystemWindows' "$APP/MainActivity.java"
          grep -q 'WindowInsets.Type.ime()' "$APP/MainActivity.java"
          grep -q 'AppTheme.NoActionBar' android/app/src/main/res/values/styles.xml
          grep -q 'windowFullscreen' android/app/src/main/res/values/styles.xml
          echo '原生代码注入完成'

      - name: 调整 AndroidManifest
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's|<application\b|<application android:usesCleartextTraffic="true"|' "$M"
          perl -0pi -e 's|<activity\b|<activity android:windowSoftInputMode="adjustResize"|' "$M"
          perl -0pi -e 's|</manifest>|    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n</manifest>|' "$M"
          grep -q 'usesCleartextTraffic' "$M"
          grep -q 'windowSoftInputMode' "$M"
          grep -q 'WRITE_EXTERNAL_STORAGE' "$M"
          perl -ne 'print if /usesCleartextTraffic|windowSoftInputMode|<activity |uses-permission/' "$M"

      - name: 替换应用图标
        run: |
          set -e
          for d in android/app/src/main/res/mipmap-*; do
            if [ -f "$d/ic_launcher.png" ]; then cp -f icon-512.png "$d/ic_launcher.png"; fi
            if [ -f "$d/ic_launcher_round.png" ]; then cp -f icon-512.png "$d/ic_launcher_round.png"; fi
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          echo '图标替换完成'

      - name: 注入正式签名配置
        run: |
          set -e
          # 版本号以 package.json 为唯一来源（改版本只改这一处）：
          #   versionName = package.json 的 version
          #   versionCode = major*10000 + minor*100 + patch（1.0.1 -> 10001）
          VERSION="$(node -p "require('./package.json').version")"
          VCODE="$(node -e "const v=require('./package.json').version.split('.').map(Number);process.stdout.write(String(v[0]*10000+v[1]*100+v[2]))")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "本次版本：versionName=$VERSION  versionCode=$VCODE"
          cp -f android-overlay/signing/rua-release.jks android/app/rua-release.jks
          test -s android/app/rua-release.jks
          cat android-overlay/gradle/rua-signing.gradle >> android/app/build.gradle
          # Capacitor 模板里原有的 versionName/versionCode 和 fragment 里的默认值一起覆盖
          VER="$VERSION" perl -pi -e 's/versionName "[^"]+"/versionName "$ENV{VER}"/' android/app/build.gradle
          VC="$VCODE" perl -pi -e 's/versionCode \d+/versionCode $ENV{VC}/' android/app/build.gradle
          grep -q 'signingConfigs' android/app/build.gradle
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
          grep -q 'enableV1Signing = true' android/app/build.gradle
          grep -q 'debuggable false' android/app/build.gradle
          grep -q "versionName \"$VERSION\"" android/app/build.gradle
          grep -q "versionCode $VCODE" android/app/build.gradle
          echo '--- build.gradle 关键行 ---'
          grep -nE 'signingConfig|enableV[123]Signing|debuggable|versionName|versionCode|storeFile' android/app/build.gradle
          echo '--- 密钥信息（应显示 CN=rua）---'
          "$JAVA_HOME/bin/keytool" -list -v -keystore android/app/rua-release.jks -storepass rua2026apk | grep -iE 'alias|SHA256|valid|别名|指纹' || true
          echo '正式签名配置注入完成'

      - name: 编译 Release APK（正式签名）
        run: |
          set -e
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: 校验签名（要求 v1 + v2 + v3）
        run: |
          set -e
          OUT_DIR=android/app/build/outputs/apk/release
          APK="$OUT_DIR/app-release.apk"
          test -s "$APK"
          if [ -f "$OUT_DIR/app-release-unsigned.apk" ]; then
            echo '::error::生成了 app-release-unsigned.apk —— 签名配置没有生效'
            exit 1
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          if [ -z "$BT" ]; then
            echo '::error::找不到 build-tools / apksigner'
            ls "$ANDROID_HOME" || true
            exit 1
          fi
          echo "使用 apksigner：${BT}apksigner"
          LOG="$RUNNER_TEMP/apksigner-verify.txt"
          "$BT"apksigner verify --verbose --print-certs "$APK" > "$LOG" 2>&1 || true
          cat "$LOG"
          grep -qE '^(Verifies|Verified)$' "$LOG" || { echo '::error::APK 签名校验未通过'; exit 1; }
          grep -q 'Verified using v1 scheme (JAR signing): true' "$LOG" || { echo '::error::缺少 v1(JAR) 签名，vivo/OPPO 会提示「安装包缺乏开发者证书」'; exit 1; }
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$LOG" || { echo '::error::缺少 v2 签名'; exit 1; }
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$LOG" || echo '::warning::没有 v3 签名（Android 9 及以上仍可安装）'
          grep -qi 'certificate DN: CN=rua' "$LOG" || echo '::warning::证书 DN 里没有 CN=rua，确认密钥是否被改动'
          ls -l "$APK"
          sha256sum "$APK"
          VERSION="${VERSION:-$(node -p "require('./package.json').version")}"
          NAMED="$OUT_DIR/rua-xiaoshouji-${VERSION}-release.apk"
          cp -f "$APK" "$NAMED"
          echo "带版本号的产物：$NAMED"
          echo '签名校验通过：v1(JAR) + v2 (+v3)，证书 CN=rua'
          echo '注意：旧版本是调试签名，装新包前必须先卸载旧版（签名不同不能覆盖安装）'

      - name: 上传 APK（构建产物）
        uses: actions/upload-artifact@v4
        with:
          name: rua-apk-release
          path: android/app/build/outputs/apk/release/rua-xiaoshouji-*-release.apk
          if-no-files-found: error

      - name: 发布到 Release（失败不影响构建结果）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${VERSION:-$(node -p "require('./package.json').version")}"
          APK="$(ls android/app/build/outputs/apk/release/rua-xiaoshouji-*-release.apk)"
          echo "准备发布：$APK"
          TAG=rua-latest
          NOTES="rua小手机 ${VERSION} 正式签名版（v1 + v2 + v3 三种签名，可直接安装）

          下载：只下载本页的 .apk 文件，不要下载 zip 再改名（改名后的包部分 ROM 会拒绝）。

          安装提示：
          1. 如果手机里已经装过旧版本（调试签名），必须先卸载旧版再安装；
          2. 安装时允许「未知来源」；vivo/OPPO 若仍拦截，可临时关闭「纯净模式 / 安全安装」；
          3. 装完打开后：屏幕从最顶端就铺满（顶部不再有状态栏高度的色带），导出文件会保存到系统「下载」目录；
          4. 排查用：屏幕最顶部连点 5 下（或地址后加 ?diag=1）会弹出「真机自检」面板，一键验证全屏与文件导出；
          5. 本次修复：真机上首次打开、未登录时点「微信」没反应（登录浮层被手机框盖住，登录页其实已打开但看不见），
             以及登录页上「密码错误」这类提示被浮层遮住的问题；被吞掉的异常现在都会记进「设置 → 问题诊断」，
             遇到异常请到该处点「全部复制」把日志发给开发者。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "rua小手机 APK（最新正式签名版 ${VERSION}）" --notes "$NOTES"
          else
            gh release create "$TAG" --target main --title "rua小手机 APK（最新正式签名版 ${VERSION}）" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$APK" --clobber
          echo "Release 已更新：https://github.com/${{ github.repository }}/releases/tag/$TAG"

